# Fahm Odoo behind Nginx, reachable by IP: http://<server-ip>:8098
# Docker publishes Odoo on 127.0.0.1:8096 (web) and 127.0.0.1:8097 (websocket, used when workers > 0).
# All names are prefixed "fahm_" so they cannot clash with the other system's Nginx config.
#
# Install:  cp deploy/nginx/fahm-odoo.conf /etc/nginx/sites-available/fahm-odoo.conf
#           ln -s /etc/nginx/sites-available/fahm-odoo.conf /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx

upstream fahm_odoo {
    server 127.0.0.1:8096;
}

upstream fahm_odoo_chat {
    server 127.0.0.1:8097;
}

map $http_upgrade $fahm_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8098;
    listen [::]:8098;
    server_name _;

    client_max_body_size 200m;

    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;
    proxy_read_timeout    720s;

    # Compress responses: Odoo's CSS/JS bundles shrink 3-5x, which matters on a ~200 ms link.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json
               application/javascript text/javascript image/svg+xml;

    access_log /var/log/nginx/fahm_odoo_access.log;
    error_log  /var/log/nginx/fahm_odoo_error.log;

    # Live chat / notifications (Odoo bus) - served by the gevent port when workers are enabled.
    location /websocket {
        proxy_pass http://fahm_odoo_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fahm_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static files: let the browser cache them so repeat visits skip the round trips.
    location ~* /web/static/ {
        proxy_pass http://fahm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://fahm_odoo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}

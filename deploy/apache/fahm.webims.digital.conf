# Fahm Odoo (docker service "odoo19", container dp_fahm-odoo19).
# Ports match docker-compose.yml: 8096 -> Odoo web (8069), 8097 -> websocket (8072).
# Change ServerName if Fahm uses a different subdomain.
<VirtualHost *:80>
    ServerName fahm.webims.digital

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /websocket ws://127.0.0.1:8097/websocket retry=0
    ProxyPassReverse /websocket ws://127.0.0.1:8097/websocket

    ProxyPass / http://127.0.0.1:8096/ connectiontimeout=5 timeout=600
    ProxyPassReverse / http://127.0.0.1:8096/

    ErrorLog ${APACHE_LOG_DIR}/fahm_odoo_error.log
    CustomLog ${APACHE_LOG_DIR}/fahm_odoo_access.log combined
</VirtualHost>

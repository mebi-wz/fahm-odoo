services:

  odoo19:
    build:
      context: .
      dockerfile: Dockerfile

    image: fahm-odoo:19.0

    container_name: dp_fahm-odoo19

    depends_on:
      - db19

    ports:
      # Only reachable from the server itself. Users go through Nginx:
      # http://<server-ip>:8098 (deploy/nginx/fahm-odoo.conf).
      - "127.0.0.1:8096:8069"
      - "127.0.0.1:8097:8072"

    volumes:
      - dp_fahm_odoo19-web-data:/var/lib/odoo
      - .:/mnt/fahm:rw
      - ./odoo.conf:/etc/odoo/odoo.conf:ro

    environment:
      HOST: db19
      USER: odoo_fahm
      PASSWORD: odoo_fahm

    command:
      - odoo
      - --database=fahm_sp
      - --db-filter=^fahm_sp$$
      - --no-database-list

    restart: unless-stopped

    networks:
      - fahm_odoo_network

  db19:
    image: postgres:15

    container_name: dp_fahm_odoo19_db

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo_fahm
      POSTGRES_PASSWORD: odoo_fahm

    volumes:
      - dp_fahm_odoo19-db-data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - fahm_odoo_network

volumes:

  dp_fahm_odoo19-web-data:

  dp_fahm_odoo19-db-data:

networks:

  fahm_odoo_network:
    driver: bridge
